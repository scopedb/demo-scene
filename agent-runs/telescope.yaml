receivers:
  grpc_addr: 127.0.0.1:4317
  http_addr: 127.0.0.1:4318
http_addr: 127.0.0.1:8080
telemetry:
  metrics_addr: 127.0.0.1:8888
batch:
  timeout: 1s
delivery:
  timeout: 10s
  queue:
    type: memory
shutdown_timeout: 15s

signals:
  traces:
    table: scopedb.guide_agents.codex_spans
    mapping:
      time: span.start_time
      end_time: span.end_time
      trace_id: span.trace_id
      span_id: span.span_id
      parent_span_id: span.parent_span_id
      name: span.name
      status: span.status.code
      duration_ns: span.duration_ns
      run_id:
        value: example-run
      model:
        source: span.attributes["model"]
        cast: string
      tool:
        source: span.attributes["tool_name"]
        cast: string
      call_id:
        source: span.attributes["call_id"]
        cast: string
  logs:
    table: scopedb.guide_agents.codex_events
    mapping:
      time: log.timestamp
      trace_id: log.trace_id
      span_id: log.span_id
      event:
        source: log.attributes["event.name"]
        cast: string
      run_id:
        value: example-run
      model:
        source: log.attributes["model"]
        cast: string
      tool:
        source: log.attributes["tool_name"]
        cast: string
      call_id:
        source: log.attributes["call_id"]
        cast: string
      duration_ms:
        source: log.attributes["duration_ms"]
        cast: int
      success:
        source: log.attributes["success"]
        cast: boolean
